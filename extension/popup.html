<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobView 自动填充</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #fafafa;
    }

    .header {
      background: #1890ff;
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .content {
      padding: 16px;
    }

    .status-card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .status-card h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #262626;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #595959;
      font-size: 14px;
    }

    .status-value {
      color: #262626;
      font-size: 14px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-online {
      background: #52c41a;
    }

    .status-offline {
      background: #ff4d4f;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #1890ff;
      color: white;
    }

    .btn-primary:hover {
      background: #40a9ff;
    }

    .btn-secondary {
      background: white;
      color: #262626;
      border: 1px solid #d9d9d9;
    }

    .btn-secondary:hover {
      border-color: #40a9ff;
      color: #40a9ff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-prompt {
      text-align: center;
      padding: 32px 16px;
    }

    .login-prompt .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: #e6f7ff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-prompt h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #262626;
    }

    .login-prompt p {
      color: #595959;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .resume-info {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .resume-info h4 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #262626;
      display: flex;
      align-items: center;
    }

    .resume-progress {
      background: #f0f0f0;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }

    .resume-progress-bar {
      height: 100%;
      background: #52c41a;
      transition: width 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #8c8c8c;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #f0f0f0;
      border-top: 2px solid #1890ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      padding: 16px;
      border-top: 1px solid #f0f0f0;
      text-align: center;
      color: #8c8c8c;
      font-size: 12px;
    }

    .error-message {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      border-radius: 6px;
      padding: 12px;
      color: #ff4d4f;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>JobView 自动填充</h1>
    <div class="subtitle">让求职更高效</div>
  </div>

  <div class="content">
    <div id="app">
      <!-- 加载状态 -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>

      <!-- 未登录状态 -->
      <div class="login-prompt" id="loginPrompt" style="display: none;">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#1890ff">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <h3>需要登录 JobView</h3>
        <p>请先登录 JobView 账号，同步您的简历数据</p>
        <button class="btn btn-primary" id="loginBtn">前往登录</button>
      </div>

      <!-- 主界面 -->
      <div id="mainContent" style="display: none;">
        <!-- 状态卡片 -->
        <div class="status-card">
          <div class="status-item">
            <div class="status-label">
              <span class="status-dot" id="connectionDot"></span>
              连接状态
            </div>
            <div class="status-value" id="connectionStatus">检查中...</div>
          </div>
          <div class="status-item">
            <div class="status-label">当前网站</div>
            <div class="status-value" id="currentSite">-</div>
          </div>
          <div class="status-item">
            <div class="status-label">可填充字段</div>
            <div class="status-value" id="fieldCount">-</div>
          </div>
        </div>

        <!-- 简历信息卡片 -->
        <div class="resume-info">
          <h4>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
              <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/>
            </svg>
            简历完善度
          </h4>
          <div class="resume-progress">
            <div class="resume-progress-bar" id="resumeProgress"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8c8c8c; margin-top: 4px;">
            <span id="resumeCompleteness">0%</span>
            <span id="lastSync">未同步</span>
          </div>
        </div>

        <!-- 操作按钮 -->
        <button class="btn btn-primary" id="fillBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white" style="margin-right: 8px;">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
          开始自动填充
        </button>

        <button class="btn btn-secondary" id="syncBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
          同步简历数据
        </button>

        <!-- 统计信息 -->
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" id="totalFills">0</div>
            <div class="stat-label">今日填充</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="timeSaved">0分钟</div>
            <div class="stat-label">节省时间</div>
          </div>
        </div>

        <!-- 错误信息 -->
        <div class="error-message" id="errorMessage" style="display: none;"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>JobView AutoFill v1.0.0</div>
    <div style="margin-top: 4px;">© 2024 JobView Team</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
