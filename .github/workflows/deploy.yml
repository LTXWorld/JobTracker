name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 默认路径（如未在 Secrets 中提供自定义路径则使用这些）
      APP_DIR: /root/JobTracker
      WEB_ROOT: /www/wwwroot/jobview.bfsmlt.top
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout (for metadata only)
        uses: actions/checkout@v4

      - name: Show commit
        run: |
          echo "Deploying $GITHUB_SHA on $GITHUB_REF"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ env.APP_DIR }}
          WEB_ROOT: ${{ env.WEB_ROOT }}
          REPO: ${{ env.REPO }}
          GIT_READ_TOKEN: ${{ secrets.GIT_READ_TOKEN }}
          # 可选：在仓库 Secrets 中设置 REMOTE_PATH_BACKEND / REMOTE_PATH_FRONTEND 覆盖默认路径
          REMOTE_PATH_BACKEND: ${{ secrets.REMOTE_PATH_BACKEND }}
          REMOTE_PATH_FRONTEND: ${{ secrets.REMOTE_PATH_FRONTEND }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: APP_DIR,WEB_ROOT,REPO,GIT_READ_TOKEN,REMOTE_PATH_BACKEND,REMOTE_PATH_FRONTEND
          script: |
            set -euo pipefail
            echo "==> Starting deploy to $APP_DIR"

            # 覆盖默认路径（如 Secrets 提供了自定义路径）
            if [ -n "${REMOTE_PATH_BACKEND:-}" ]; then
              APP_DIR="$REMOTE_PATH_BACKEND"
              echo "==> Using APP_DIR from REMOTE_PATH_BACKEND: $APP_DIR"
            fi
            if [ -n "${REMOTE_PATH_FRONTEND:-}" ]; then
              WEB_ROOT="$REMOTE_PATH_FRONTEND"
              echo "==> Using WEB_ROOT from REMOTE_PATH_FRONTEND: $WEB_ROOT"
            fi

            # Ensure repo exists; clone if missing (supports private repo via token)
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> Repo not found, cloning..."
              mkdir -p "$(dirname "$APP_DIR")"
              if [ -n "${GIT_READ_TOKEN:-}" ]; then
                git clone "https://${GIT_READ_TOKEN}@github.com/${REPO}.git" "$APP_DIR"
              else
                git clone "https://github.com/${REPO}.git" "$APP_DIR"
              fi
            fi

            # Fetch latest code
            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"
            git fetch --all --prune
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout -f main
            else
              git checkout -f -B main origin/main
            fi
            git reset --hard origin/main

            # Ensure env and dirs
            mkdir -p "$APP_DIR/logs/backend" "$APP_DIR/backend/uploads" "$WEB_ROOT"

            echo "==> Rebuild and restart backend stack (docker-compose.baota.yml)"
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f docker-compose.baota.yml up -d --build
            else
              echo "docker-compose not found on server; please install or symlink" >&2
              exit 1
            fi

            echo "==> Build frontend with dockerized Node"
            cd "$APP_DIR/frontend"
            docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -lc 'npm ci && ./node_modules/.bin/vite build'

            echo "==> Publish frontend to Baota web root"
            rsync -a --delete --exclude='.user.ini' "$APP_DIR/frontend/dist/" "$WEB_ROOT/"

            echo "==> Reload Nginx"
            if command -v bt >/dev/null 2>&1; then
              bt nginx || true
            elif command -v systemctl >/dev/null 2>&1; then
              nginx -t && systemctl reload nginx || true
            else
              nginx -t && nginx -s reload || true
            fi

            echo "==> Health checks"
            curl -fsS http://127.0.0.1:8010/health | sed -n '1,120p'
            curl -I --max-time 10 https://jobview.bfsmlt.top 2>/dev/null | sed -n '1,10p'
