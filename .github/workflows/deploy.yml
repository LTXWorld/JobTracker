# 工作流名称
name: Deploy JobView Project

# 触发条件：当有代码推送到 main 分支时触发
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# 任务
jobs:
  build-and-deploy:
    # 运行环境：使用最新的 Ubuntu 系统
    runs-on: ubuntu-latest

    # 步骤
    steps:
      # 第一步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 第二步：设置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 以 go.mod 为准，避免版本不匹配
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # 第三步：设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 第四步：编译后端
      - name: Build Backend
        working-directory: backend
        run: |
          go mod download
          # 交叉编译 Linux amd64，便于部署到大多数服务器
          GOOS=linux GOARCH=amd64 go build -o jobview-backend ./cmd

      # 第五步：打包前端
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      
      # 在部署后端文件之前，先停止服务，避免 "Text file busy" 错误
      - name: Stop Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl stop jobview-backend    

      # 第六步：部署后端二进制文件
      - name: Deploy Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/jobview-backend"
          target: "${{ secrets.REMOTE_PATH_BACKEND }}"
          strip_components: 1
          overwrite: true

      # 第七步：部署前端静态文件
      - name: Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/**"
          target: "${{ secrets.REMOTE_PATH_FRONTEND }}"
          strip_components: 2 # 去掉 frontend/dist 两层目录
          overwrite: true

      # 可选：部署前清理远端前端目录（避免旧文件残留）
      # - name: Clean remote frontend dir
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       mkdir -p "${{ secrets.REMOTE_PATH_FRONTEND }}"
      #       rm -rf "${{ secrets.REMOTE_PATH_FRONTEND }}"/*

      # 第八步：重启服务器上的后端服务
      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl daemon-reload || true
            sudo systemctl restart jobview-backend
            sleep 2
            sudo systemctl status jobview-backend --no-pager -l || true
