<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="16" cy="16" r="15" fill="url(#gradient1)" stroke="#fff" stroke-width="1"/>

  <!-- O字母 -->
  <circle cx="11" cy="16" r="6" fill="none" stroke="#fff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- C字母 -->
  <path d="M 21 10 A 6 6 0 0 0 21 22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>